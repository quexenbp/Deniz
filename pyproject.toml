[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deniz"
version = "0.1.0"
description = "Deniz: open-source intelligence workbench with a typed, cached, agent-ready core."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "quexenbp" }]
keywords = ["osint", "recon", "attack-surface", "security", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.8,<3",
  "dnspython>=2.6,<3",
  "requests>=2.31",
  "phonenumbers>=8.13",
  "vaderSentiment>=3.3",
  "socksio>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "pytest-recording>=0.13",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
  "build>=1.2",
  "twine>=5",
]
browser = ["playwright>=1.45"]
tor = ["requests[socks]>=2.32", "socksio>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
tui = ["textual>=0.70"]

[project.scripts]
deniz = "deniz.cli:main"

[project.urls]
Homepage = "https://github.com/quexenbp/Deniz"
Issues = "https://github.com/quexenbp/Deniz/issues"

[tool.setuptools]
include-package-data = true
packages = { find = { include = ["deniz*"] } }

[tool.setuptools.package-data]
deniz = ["data/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "load: heavier load/soak tests",
  "network: needs a live network",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
allowed-confusables = ["ı", "İ", "ş", "Ş", "ğ", "Ğ", "ç", "Ç", "ö", "Ö", "ü", "Ü"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
exclude = []
