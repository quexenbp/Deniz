name: canary

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Live provider canary
        run: python scripts/canary.py --json > canary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary
          path: canary.json
